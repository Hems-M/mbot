<!doctype html>
<html lang="en" data-theme="light">
<head>
{% include head.html %}
</head>
<body class="{{ layout.body_class }}{% if page.body_class %} {{ page.body_class }}{% endif %}">
{% include header.html %}
{{ content }}
{% include footer.html %}
{% include search.html %}
<div class="lightbox" data-lightbox hidden>
  <button class="icon-btn lightbox-close" type="button" aria-label="Close image" data-lightbox-close>{% include icon.html name="close" %}</button>
  <img alt="" data-lightbox-img>
  <p class="lightbox-caption" data-lightbox-caption></p>
</div>
<script>window.MBOT_BASEURL = "{{ site.baseurl }}";</script>
<script src="{{ '/assets/js/site.js' | relative_url }}" defer></script>
</body>
</html>
