<div class="table-wrap">
<table class="feature-table compare-table">
  <thead><tr><th scope="col"></th><th scope="col">MBot Classic<br><span class="th-sub">Server setup</span></th><th scope="col">MBot Omni<br><span class="th-sub">Desktop setup</span></th></tr></thead>
  <tbody>
  {%- for r in site.data.features.compare %}
    <tr>
      <th scope="row" data-label="">{{ r.label }}</th>
      <td data-label="Classic">{{ r.classic }}</td>
      <td data-label="Omni">{{ r.omni }}</td>
    </tr>
  {%- endfor %}
  </tbody>
</table>
</div>
