<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
{%- if page.url == "/" -%}
{%- assign full_title = site.title | append: " | Build, set up and program your robot" -%}
{%- else -%}
{%- assign full_title = page.title | append: " | " | append: site.title -%}
{%- endif %}
<title>{{ full_title }}</title>
<meta name="description" content="{{ page.description | default: site.description | strip_html | escape }}">
<link rel="canonical" href="{{ page.url | absolute_url }}">
<link rel="icon" type="image/png" href="{{ '/assets/images/mbot-logo.png' | relative_url }}">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#00274C">
<script>
  /* Set the theme before the page draws, so it does not flash. */
  (function () {
    var t = null;
    try { t = localStorage.getItem("mbot-theme"); } catch (e) {}
    if (t !== "light" && t !== "dark") {
      t = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
    }
    document.documentElement.setAttribute("data-theme", t);
  })();
</script>
<link rel="stylesheet" href="{{ '/assets/css/site.css' | relative_url }}">
