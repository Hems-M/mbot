<div class="table-wrap">
<table class="feature-table">
  <thead><tr><th scope="col">Service</th><th scope="col">What it does</th><th scope="col">Check it when</th></tr></thead>
  <tbody>
  {%- for s in site.data.features.services %}
    <tr>
      <th scope="row" data-label="Service"><code>{{ s.name }}</code></th>
      <td data-label="What it does">{{ s.what }}</td>
      <td data-label="Check it when">{{ s.check }}</td>
    </tr>
  {%- endfor %}
  </tbody>
</table>
</div>
