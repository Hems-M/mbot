# Builds the site and publishes it to GitHub Pages (https://hems-m.github.io/mbot/)
# on every push to site/simplified.
#
# Uses GitHub's own Pages builder (actions/jekyll-build-pages). It builds with
# the same github-pages gem set (Jekyll 3.10) inside GitHub's container, so it
# does not need "bundle install" and does not depend on Gemfile.lock.
name: Deploy Jekyll site to Pages

on:
  push:
    branches: ["site/simplified"]
  # Lets you run it by hand from the Actions tab.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one deploy at a time. A newer push waits for the running one.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
