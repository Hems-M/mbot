# Builds the site on every push to main (and to redesign/* branches) and
# publishes a ready-to-run copy on the Releases page:
#   main              -> release "site-latest",                mbot-site-main.zip
#   redesign/<name>   -> release "site-redesign-<name>",       mbot-site-redesign-<name>.zip
# Each zip unzips to a folder with the same name and has VERSION.txt inside,
# so copies of different branches never get mixed up.
# Nothing is deployed to GitHub Pages. To view the site, download the zip,
# unzip it and run serve.sh (Mac/Linux) or serve.bat (Windows).
name: Build site and publish download

on:
  push:
    branches: ["main", "redesign/**"]
  # Lets you run it by hand from the Actions tab.
  workflow_dispatch:

# contents: write is needed to create the release.
permissions:
  contents: write

# A newer push replaces a build that is still running.
concurrency:
  group: "site-download-${{ github.ref_name }}"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@086ffb1a2090c870a3f881cc91ea83aa4243d408 # v1.195.0
        with:
          ruby-version: '3.2'
          bundler-cache: true # runs 'bundle install' and caches the gems
          cache-version: 0

      - name: Build with Jekyll
        # Outputs to ./_site. baseurl stays "" so every /docs/... link works
        # when the folder is served from http://localhost:4000/.
        run: bundle exec jekyll build --config _config.yml,_config.offline.yml
        env:
          JEKYLL_ENV: production

      - name: Package the site
        run: |
          SLUG="$(echo "$GITHUB_REF_NAME" | tr '/' '-')"
          NAME="mbot-site-$SLUG"
          echo "NAME=$NAME" >> "$GITHUB_ENV"
          mkdir -p "dist/$NAME"
          cp -R _site/. "dist/$NAME/"
          cp local/serve.py local/serve.sh local/serve.bat local/HOW-TO-VIEW.txt "dist/$NAME/"
          chmod +x "dist/$NAME/serve.sh"
          printf 'Branch: %s\nCommit: %s\nBuilt:  %s\n' "$GITHUB_REF_NAME" "${GITHUB_SHA::7}" "$(date -u '+%Y-%m-%d %H:%M UTC')" > "dist/$NAME/VERSION.txt"
          cd dist && zip -qr "$NAME.zip" "$NAME"

      - name: Keep the zip as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.NAME }}
          path: dist/${{ env.NAME }}.zip

      - name: Publish the zip on the Releases page
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$GITHUB_REF_NAME" = "main" ]; then
            TAG="site-latest"; TITLE="MBot site (offline copy)"
          else
            TAG="site-$(echo "$GITHUB_REF_NAME" | tr '/' '-')"; TITLE="MBot site, $GITHUB_REF_NAME branch (offline copy)"
          fi
          gh release delete "$TAG" --yes --cleanup-tag || true
          gh release create "$TAG" "dist/$NAME.zip" \
            --target "$GITHUB_SHA" \
            --title "$TITLE" \
            --notes "Built from commit ${GITHUB_SHA::7}. Download the zip, unzip it, then run serve.sh (Mac/Linux) or serve.bat (Windows). VERSION.txt inside says which branch it is."
