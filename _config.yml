# MBot Simplified website
#
# Plain Jekyll site with its own layouts (no remote theme).
# It builds with the github-pages gem (Jekyll 3.10), the same as before.
#
# Where things live:
#   _data/nav.yml        sidebar and step order (prev / next buttons)
#   _data/mbot.yml       versions, image links, logins (change them here only)
#   _data/features.yml   the "What is on the robot" tables
#   _layouts/            page templates
#   _includes/           shared pieces (header, sidebar, firmware picker, ...)
#   assets/css/site.css  all styles (light and dark theme)
#   assets/js/site.js    theme switch, search, copy buttons, image viewer
#   docs/                every documentation page

title: "MBot"
description: "Build, set up and program the MBot, the University of Michigan teaching robot."
email: um-mbothelp@umich.edu
# Published from the Hems-M/mbot fork with GitHub Pages.
# For the official site use url "https://mbot.robotics.umich.edu", baseurl "" and add the CNAME file back.
url: "https://hems-m.github.io"
baseurl: "/mbot"
lang: en-US

# Help contacts shown in the footer and on help pages.
help_email: um-mbothelp@umich.edu
issues_url: https://github.com/michiganrobotics/mbot/issues/new

markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  syntax_highlighter: rouge

permalink: pretty

plugins:
  - jekyll-redirect-from
  - jekyll-sitemap

# Same plugins in safe mode (GitHub Pages).
whitelist:
  - jekyll-redirect-from
  - jekyll-sitemap

defaults:
  - scope:
      path: "docs"
    values:
      layout: doc

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - scripts/
  - vendor
  - .bundle
  - .sass-cache
  - .jekyll-cache
  - node_modules
  - serve.py
